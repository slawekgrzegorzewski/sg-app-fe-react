fragment LedgerCalculationParameterFields on NetAndVatPercentageParameters {
    __typename
    strategyType
    costPercentage
    deductibleVatPercentage
}

fragment AccountingDocumentFields on AccountingDocument {
    attachmentFileName
    counterpartyPublicId
    postedToLedger
    publicId
    documentType
    amount
    netAmount
    vatAmount
    currency
    documentNumber
    documentDate
    counterparty
    counterpartyAddress
    counterpartyTaxId
    ksefNumber
    description
}

fragment CompanyLedgerSummaryFields on CompanyLedgerSummary {
    providedGoodsAndServicesValue
    otherIncome
    totalIncome
    purchasedGoodsAndMaterialsValue
    additionalCostOfPurchase
    remunerationInCashOrInKind
    otherExpense
    totalExpense
    additionalColumnValue
    researchAndDevelopmentExpense
}

fragment CompanyLedgerFields on CompanyLedger {
    monthSummary { ...CompanyLedgerSummaryFields }
    yearToDateSummary { ...CompanyLedgerSummaryFields }
    currency
    yearMonth
    entries {
        publicId
        calculationStrategyPublicId
        includedAmount
        exchangeRate
        ledgerColumn
        entryOrder
        entryDate
        providedGoodsAndServicesValue
        otherIncome
        totalIncome
        purchasedGoodsAndMaterialsValue
        additionalCostOfPurchase
        remunerationInCashOrInKind
        otherExpense
        totalExpense
        additionalColumnValue
        researchAndDevelopmentExpense
        researchAndDevelopmentDescription
        comments
        accountingDocument {
            ...AccountingDocumentFields
        }
    }
}

fragment CounterpartyFields on Counterparty {
    kind
    publicId
    name
    address
    taxId
    active
}

query CompanyAccounting($yearMonth: YearMonth!) {
    counterparties { ...CounterpartyFields }
    ledgerCalculationStrategies {
        publicId
        name
        strategyType
        parameters {
            __typename
            ...LedgerCalculationParameterFields
        }
    }
    companyLedger(yearMonth: $yearMonth) {
        ...CompanyLedgerFields
    }
    companyLedgerAvailableDocuments(yearMonth: $yearMonth) {
        ...AccountingDocumentFields
    }
    companyAccountingDocuments(yearMonth: $yearMonth) {
        ...AccountingDocumentFields
    }
}

mutation CreateCompanyLedgerEntry($input: CompanyLedgerEntryInput!) {
    createCompanyLedgerEntry(input: $input) {
        publicId
    }
}

mutation CreateAccountingDocument($input: AccountingDocumentInput!) {
    createAccountingDocument(input: $input) {
        ...AccountingDocumentFields
    }
}

mutation SaveCounterparty($publicId: UUID, $input: CounterpartyInput!) {
    saveCounterparty(publicId: $publicId, input: $input) { ...CounterpartyFields }
}
mutation CreateCounterpartyFromDocument($documentPublicId: UUID!, $kind: CounterpartyKind, $counterpartyPublicId: UUID) {
    createCounterpartyFromDocument(documentPublicId: $documentPublicId, kind: $kind, counterpartyPublicId: $counterpartyPublicId) { ...CounterpartyFields }
}

query GetCounterparties {
    counterparties { ...CounterpartyFields }
}

mutation UpdateCompanyLedgerEntry($publicId: UUID!, $input: CompanyLedgerEntryInput!) {
    updateCompanyLedgerEntry(publicId: $publicId, input: $input) { publicId }
}

mutation UpdateAccountingDocument($publicId: UUID!, $input: AccountingDocumentInput!) {
    updateAccountingDocument(publicId: $publicId, input: $input) { ...AccountingDocumentFields }
}

mutation UploadAccountingDocumentAttachment($publicId: UUID!, $file: Upload!) {
    uploadAccountingDocumentAttachment(input: {publicId: $publicId, file: $file})
}

query DownloadAccountingDocumentAttachment($publicId: UUID!) {
    accountingDocumentAttachment(publicId: $publicId) {
        fileName
        contentBase64
    }
}

mutation DeleteAccountingDocumentAttachment($publicId: UUID!) {
    deleteAccountingDocumentAttachment(publicId: $publicId)
}

mutation SaveCounterpartyWithConflict($publicId: UUID, $input: CounterpartyInput!, $expected: CounterpartyInput) {
    saveCounterpartyWithConflict(publicId: $publicId, input: $input, expected: $expected) {
        saved { ...CounterpartyFields }
        conflict { ...CounterpartyFields }
    }
}
