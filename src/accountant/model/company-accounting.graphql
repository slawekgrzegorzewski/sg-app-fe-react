fragment LedgerCalculationParameterFields on NetAndVatPercentageParameters {
    __typename
    strategyType
    costPercentage
    deductibleVatPercentage
}

fragment AccountingDocumentFields on AccountingDocument {
    counterpartyPublicId
    postedToLedger
    publicId
    documentType
    amount
    netAmount
    vatAmount
    currency
    documentNumber
    documentDate
    counterparty
    counterpartyAddress
    counterpartyTaxId
    ksefNumber
    description
}

fragment CompanyLedgerFields on CompanyLedger {
    currency
    yearMonth
    entries {
        publicId
        calculationStrategyPublicId
        includedAmount
        exchangeRate
        ledgerColumn
        entryOrder
        entryDate
        providedGoodsAndServicesValue
        otherIncome
        totalIncome
        purchasedGoodsAndMaterialsValue
        additionalCostOfPurchase
        remunerationInCashOrInKind
        otherExpense
        totalExpense
        additionalColumnValue
        researchAndDevelopmentExpense
        researchAndDevelopmentDescription
        comments
        accountingDocument {
            ...AccountingDocumentFields
        }
    }
}

fragment CounterpartyFields on Counterparty {
    kind
    publicId
    name
    address
    taxId
    active
}

query CompanyAccounting($yearMonth: YearMonth!) {
    counterparties { ...CounterpartyFields }
    ledgerCalculationStrategies {
        publicId
        name
        strategyType
        parameters {
            __typename
            ...LedgerCalculationParameterFields
        }
    }
    companyLedger(yearMonth: $yearMonth) {
        ...CompanyLedgerFields
    }
    companyLedgerAvailableDocuments(yearMonth: $yearMonth) {
        ...AccountingDocumentFields
    }
    companyAccountingDocuments(yearMonth: $yearMonth) {
        ...AccountingDocumentFields
    }
}

mutation CreateCompanyLedgerEntry($input: CompanyLedgerEntryInput!) {
    createCompanyLedgerEntry(input: $input) {
        publicId
    }
}

mutation CreateAccountingDocument($input: AccountingDocumentInput!) {
    createAccountingDocument(input: $input) {
        ...AccountingDocumentFields
    }
}

mutation SaveCounterparty($publicId: UUID, $input: CounterpartyInput!) {
    saveCounterparty(publicId: $publicId, input: $input) { ...CounterpartyFields }
}
mutation CreateCounterpartyFromDocument($documentPublicId: UUID!, $kind: CounterpartyKind) {
    createCounterpartyFromDocument(documentPublicId: $documentPublicId, kind: $kind) { ...CounterpartyFields }
}

query GetCounterparties {
    counterparties { ...CounterpartyFields }
}

mutation UpdateCompanyLedgerEntry($publicId: UUID!, $input: CompanyLedgerEntryInput!) {
    updateCompanyLedgerEntry(publicId: $publicId, input: $input) { publicId }
}
