# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: deploy application

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.13.1]
        
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run codegen
    - run: npm run typecheck
    - run: npm test
    - run: npm run build-prod
    - name: create react.tar
      run: |
        tar -czf react.tar -C build .
    - name: copy file via ssh password
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 10000
        source: "react.tar"
        target: "/tmp/"
    - name: unpack and deploy application files
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 10000
        script: |
          rm -rf /srv/cluster/www/gateway/react/*
          mkdir -p /srv/cluster/www/gateway/react/
          tar -xf /tmp/react.tar -C /srv/cluster/www/gateway/react/
          rm /tmp/react.tar
